<div class="eqLogic eqLogic-widget allowResize allowReorderCmd #custom_layout# #eqLogic_class# #class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: #width#;height: #height#;#style#">
    <span class="statusCmd" style="position : absolute;right : 5px; width : 30px;z-index: 1030;"></span>
    <center class="widget-name">
        <span class="warning" title="#alert_name#">
            <i class='#alert_icon#'></i>
        </span>
        <span class="reportModeVisible">#name_display#
            <span class="object_name">#object_name#</span>
        </span>
        <a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </center>

    <div class="classContenant#id#" id="idActual#id#">
        <div class="classTitle#id#" data-cmd_id="#cmd_modelVersion_id#">
          <span id="cmd_modelVersion_id#id#" class="title" style="display:#cmd_modelVersion_display#"></span>
        </div>
        <div class="classTitle#id#" data-cmd_id="#cmd_host_id#">
          <span id="cmd_host_id#id#" class="title"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_nozzleTemp_id#">
          <span id="cmd_nozzleTemp_id#id#" class="title" style="display:#cmd_nozzleTemp_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_bedTemp_id#">
          <span id="cmd_bedTemp_id#id#" class="title" style="display:#cmd_bedTemp_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_fan_id#">
          <span id="cmd_fan_id#id#" class="title" style="display:#cmd_fan_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_curFeedratePct_id#">
          <span id="cmd_curFeedratePct_id#id#" class="title" style="display:#cmd_curFeedratePct_display#"></span>
        </div>

    </div>
    <div class="classContenant#id#" id="idInPrinting#id#">
        <div class="classStatus#id#" data-cmd_id="#cmd_state_id#">
          <span id="cmd_state_id#id#" class="title" style="display:#cmd_state_display#"></span>
        </div>
        <div class="classStatus#id#">
          <span class="classValueName#id#">#cmd_layer_name# :</span>
          <span class="classValue#id#" id="idNumberOdLayers#id#">
              <span class="actual" style="right: 30px !important;"></span>
              <span class="slash">/</span>
              <span class="total"></span>
          </span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_printStartTime_id#">
          <span id="cmd_printStartTime_id#id#" class="title" style="display:#cmd_printStartTime_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_printJobTime_id#">
          <span id="cmd_printJobTime_id#id#" class="title" style="display:#cmd_printJobTime_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_printLeftTime_id#">
          <span id="cmd_printLeftTime_id#id#" class="title" style="display:#cmd_printLeftTime_display#"></span>
        </div>
        <div class="classStatus#id# history cursor" data-cmd_id="#cmd_percent_id#">
          <span id="cmd_percent_id#id#" class="title" style="display:#cmd_percent_display#">
          </span>
        </div>


    </div>
    <div class="classContenant#id#" id="idErr#id#" style="display:#cmd_err_display#">
        <div class="classStatus#id#" data-cmd_id="#cmd_err_id#">
          <span id="cmd_err_id#id#" class="title"></span>
        </div>
    </div>
    #divGraphInfo#

    <style>
        .classContenant#id# {
            width: 98%;
            margin-left:1%;
            color: #000000;
            border-style: solid;
            border-color: #d0d0d0;
            border-radius: 10px;
            background-color:lightgrey;
            opacity:.9;
        }
        .classContenant#id#:hover {
            opacity:.65;
        }
        #idInPrinting#id#, #idErr#id# {
            margin-top:5px;
        }
        .classTitle#id# {
            position: relative;
            width: 100%;
            border-radius: 5px;
            text-align: left;
            background-color: #E0E0E0;
            color: #808080;
        }
        .classStatus#id# {
            position: relative;

        }
        .classValueName#id# {
            position: relative;
            width: 100%;
            left: 20px;
            text-align: left;
            font-size: 14px;
            color: #000000;
        }
        .classValue#id# {
            position: absolute;
            width: 50%;
            right: 20px;
            text-align: right;
            font-size: 14px;
            color: #808080;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .progress#id# {
            height: 19px !important;
            background-color: var(--sc-form-color);
        }

        #progressBar#id# {
            position: absolute;
            width: 0%;
            height: 100%;
            border-radius: 25px 0 0 25px;
            background-image: 
              repeating-linear-gradient(
                45deg,
                #606dbc,
                #606dbc 10px,
                #465298 10px,
                #465298 20px

              );
            background-size: 100% 100%;
          }
        
        .classProgress#id# {
            display: inline-flex;
            border-radius: 25px;
            width: 50%;
            float: right;
            margin-right: 5px;
        }
      
        .classProgress#id# .classValue#id# {
           z-index: 2;
        }
    </style>
    <script type="text/javascript">
        //modèle de l'imprimante
        jeedom.cmd.addUpdateFunction('#cmd_modelVersion_id#', function(_options) {
            document.getElementById('cmd_modelVersion_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_modelVersion_name#</span> <span class="classValue#id#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_modelVersion_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_modelVersion_id#',
                display_value: '#cmd_modelVersion_value#'
            }]);
        }

        //hostname de l'appareil + IP
        jeedom.cmd.addUpdateFunction('#cmd_host_id#', function(_options) {
            document.getElementById('cmd_host_id#id#').innerHTML = '<span class="classValueName#id#">#device_hostname# #device_ip#</span> <span class="classValue#id#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_host_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_host_id#',
                display_value: '#cmd_model_value#'
            }]);
        }

        //Température du bed
        jeedom.cmd.addUpdateFunction('#cmd_bedTemp_id#', function(_options) {
            document.getElementById('cmd_bedTemp_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_bedTemp_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_bedTemp_name# :</span> <span class="classValue#id#">'+_options.display_value+' °C</span>';
        });
        if (!isNaN('#cmd_bedTemp_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_bedTemp_id#',
                display_value: '#cmd_bedTemp_value#',
                collectDate: '#cmd_bedTemp_collectDate#',
                valueDate: '#cmd_bedTemp_valueDate#'
            }]);
        }

        //Température de la buse
        jeedom.cmd.addUpdateFunction('#cmd_nozzleTemp_id#', function(_options) {
            document.getElementById('cmd_nozzleTemp_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_nozzleTemp_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_nozzleTemp_name# :</span> <span class="classValue#id#">'+_options.display_value+' °C</span>';
        });
        if (!isNaN('#cmd_nozzleTemp_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_nozzleTemp_id#',
                display_value: '#cmd_nozzleTemp_value#',
                collectDate: '#cmd_nozzleTemp_collectDate#',
                valueDate: '#cmd_nozzleTemp_valueDate#'
            }]);
        }

        //Vitesse du ventilateur
        jeedom.cmd.addUpdateFunction('#cmd_fan_id#', function(_options) {
            document.getElementById('cmd_fan_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_fan_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_fan_name# :</span> <span class="classValue#id#">'+_options.display_value+' %</span>';
        });
        if (!isNaN('#cmd_fan_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_fan_id#',
                display_value: '#cmd_fan_value#',
                collectDate: '#cmd_fan_collectDate#',
                valueDate: '#cmd_fan_valueDate#'
            }]);
        }

        //Vitesse du tête
        jeedom.cmd.addUpdateFunction('#cmd_curFeedratePct_id#', function(_options) {
            document.getElementById('cmd_curFeedratePct_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_curFeedratePct_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_curFeedratePct_name# :</span> <span class="classValue#id#">'+_options.display_value+' %</span>';
        });
        if (!isNaN('#cmd_curFeedratePct_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_curFeedratePct_id#',
                display_value: '#cmd_curFeedratePct_value#',
                collectDate: '#cmd_curFeedratePct_collectDate#',
                valueDate: '#cmd_curFeedratePct_valueDate#'
            }]);
        }

        //Etat de l'imprimante
        jeedom.cmd.addUpdateFunction('#cmd_state_id#', function(_options) {
            document.getElementById('cmd_state_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_state_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_state_name# :</span> <span class="classValue#id#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_state_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_state_id#',
                display_value: '#cmd_state_value#',
                collectDate: '#cmd_state_collectDate#',
                valueDate: '#cmd_state_valueDate#'
            }]);
        }

        //Couches
        jeedom.cmd.addUpdateFunction('#cmd_layer_id#', function(_options) {
            document.querySelector('#idNumberOdLayers#id# .actual').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.querySelector('#idNumberOdLayers#id# .actual').innerHTML = '<span id="cmd_layer_id#id#" class="title history cursor" data-cmd_id="#cmd_layer_id#" style="display:#cmd_layer_display#"><span class="classValue#id#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_layer_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_layer_id#',
                display_value: '#cmd_layer_value#',
                collectDate: '#cmd_layer_collectDate#',
                valueDate: '#cmd_layer_valueDate#'
            }]);
        }
        jeedom.cmd.addUpdateFunction('#cmd_TotalLayer_id#', function(_options) {
            document.querySelector('#idNumberOdLayers#id# .total').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.querySelector('#idNumberOdLayers#id# .total').innerHTML = '<span id="cmd_TotalLayer_id#id#" class="title history cursor" data-cmd_id="#cmd_TotalLayer_id#" style="display:#cmd_TotalLayer_display#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_TotalLayer_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_TotalLayer_id#',
                display_value: '#cmd_TotalLayer_value#',
                collectDate: '#cmd_TotalLayer_collectDate#',
                valueDate: '#cmd_TotalLayer_valueDate#'
            }]);
        }

        //Heure de début d'impression
        jeedom.cmd.addUpdateFunction('#cmd_printStartTime_id#', function(_options) {
            var formattedTime = "N/A";
            if (_options.display_value != 0) {
                var date = new Date(_options.display_value * 1000);
                var hours = "0" + date.getHours();
                var minutes = "0" + date.getMinutes();
                var seconds = "0" + date.getSeconds();
                formattedTime = hours.substr(-2) + ':' + minutes.substr(-2) + ':' + seconds.substr(-2);
            }
            document.getElementById('cmd_printStartTime_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_printStartTime_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_printStartTime_name# :</span> <span class="classValue#id#">'+formattedTime+'</span>';
        });
        if (!isNaN('#cmd_printStartTime_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_printStartTime_id#',
                display_value: '#cmd_printStartTime_value#',
                collectDate: '#cmd_printStartTime_collectDate#',
                valueDate: '#cmd_printStartTime_valueDate#',
                unit: '#cmd_printStartTime_unite#'
            }]);
        }

        //durées cmd_printJobTime_id cmd_printLeftTime_id
        jeedom.cmd.addUpdateFunction('#cmd_printJobTime_id#', function(_options) {
            let unit = _options.unit ? _options.unit : '#cmd_printJobTime_unite#';
            document.getElementById('cmd_printJobTime_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_printJobTime_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_printJobTime_name# :</span> <span class="classValue#id#">'+parseInt(_options.display_value)+' ' + unit +'</span>';
        });
        if (!isNaN('#cmd_printJobTime_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_printJobTime_id#',
                display_value: '#cmd_printJobTime_value#',
                collectDate: '#cmd_printJobTime_collectDate#',
                valueDate: '#cmd_printJobTime_valueDate#',
                unit: '#cmd_printJobTime_unite#'
            }]);
        }

        jeedom.cmd.addUpdateFunction('#cmd_printLeftTime_id#', function(_options) {
            let unit = _options.unit ? _options.unit : '#cmd_printLeftTime_unite#';
            document.getElementById('cmd_printLeftTime_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_printLeftTime_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_printLeftTime_name# :</span> <span class="classValue#id#">'+parseInt(_options.display_value)+' ' + unit +'</span>';
        });
        if (!isNaN('#cmd_printLeftTime_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_printLeftTime_id#',
                display_value: '#cmd_printLeftTime_value#',
                collectDate: '#cmd_printLeftTime_collectDate#',
                valueDate: '#cmd_printLeftTime_valueDate#',
                unit: '#cmd_printLeftTime_unite#'
            }]);
        }

        //Progression
        jeedom.cmd.addUpdateFunction('#cmd_percent_id#', function(_options) {
            document.getElementById('cmd_percent_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_percent_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_percent_name# :</span> <div class="classProgress#id# progress#id#"><span id="progressBar#id#"></span><span class="classValue#id#">'+_options.display_value+' %</span></div>';
            let val = parseInt(_options.display_value);
            val = parseFloat(document.querySelector('.classProgress#id#').offsetWidth / 100) * val;
            document.getElementById('progressBar#id#').style.width = val + 'px';
        });
        if (!isNaN('#cmd_percent_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_percent_id#',
                display_value: '#cmd_percent_value#',
                collectDate: '#cmd_percent_collectDate#',
                valueDate: '#cmd_percent_valueDate#'
            }]);
        }

        //Nombre de couches
        jeedom.cmd.addUpdateFunction('#cmd_err_id#', function(_options) {
          console.log(_options)
            document.getElementById('cmd_err_id#id#').setAttribute('title','{{Date de valeur}} : '+_options.valueDate+'<br/>{{Date de collecte}} : '+_options.collectDate);
            document.getElementById('cmd_err_id#id#').innerHTML = '<span class="classValueName#id#">#cmd_err_name# :</span> <span class="classValue#id#">'+_options.display_value+'</span>';
        });
        if (!isNaN('#cmd_err_id#')) {
            jeedom.cmd.refreshValue([{
                cmd_id :'#cmd_err_id#',
                display_value: '#cmd_err_value#',
                collectDate: '#cmd_err_collectDate#',
                valueDate: '#cmd_err_valueDate#'
            }]);
        } else {
            document.getElementById('idErr#id#').unseen();
        }
	</script>
</div>
